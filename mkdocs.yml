site_name: Rohith Kumar Prasanna Kumar
site_url: https://rohithkumar.dev
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate

nav:
  - Home: index.md
  - CV: cv.md
  - Projects:
    - projects/index.md
    - Hybrid RAG with LangGraph: projects/hybrid-rag-langgraph.md
    - Outbound Traffic Monitor: projects/outbound-traffic-monitor.md
    - Holistic Selfie with Gestures: projects/holistic-selfie-gesture.md
  - Contact: contact.md
  - Blog:
    - blog/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prasroku
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/rohith-kumar-prasanna-kumar
      name: LinkedIn

plugins:
  - blog:
      blog_dir: blog
      archive: true
      categories: true
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js